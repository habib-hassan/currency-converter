<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="background-gradient">
      <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="converter-card">
          <div class="card-header">
            <h1>Currency Converter</h1>
            <p class="subtitle">Real-time exchange rates</p>
          </div>
          
          <form action="" class="converter-form">
            <div class="amount-section">
              <label for="amountInput" class="form-label">Amount</label>
              <div class="input-wrapper">
                <input type="number" id="amountInput" class="form-control amount-input" value="1" min="0" step="0.01" />
                <span class="input-icon">$</span>
              </div>
            </div>

            <div class="currencies-section">
              <div class="currency-selector from-currency">
                <label class="currency-label">From</label>
                <div class="currency-box">
                  <img class="flag-icon" src="https://flagsapi.com/US/flat/64.png" alt="From currency flag">
                  <select class="currency-select" data-currency-type="from">
                  </select>
                </div>
              </div>

              <div class="swap-button-container">
                <button type="button" class="swap-btn" title="Swap currencies">⇄</button>
              </div>

              <div class="currency-selector to-currency">
                <label class="currency-label">To</label>
                <div class="currency-box">
                  <img class="flag-icon" src="https://flagsapi.com/AE/flat/64.png" alt="To currency flag">
                  <select class="currency-select" data-currency-type="to">
                  </select>
                </div>
              </div>
            </div>

            <div class="result-section">
              <div class="result-box">
                <p class="result-label">Result</p>
                <p class="result-value">-</p>
              </div>
            </div>

            <button type="submit" class="btn-convert">Convert Now</button>
          </form>

          <div class="card-footer">
            <p class="text-muted">Exchange rates updated in real-time</p>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="country.js"></script>
    <script src="app.js"></script>
  </body>
</html>
